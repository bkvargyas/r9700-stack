# /etc/modprobe.d/r9700-guestplace.conf (VM100 guest)
# amdgpu must not bind before the cards are moved: r9700-guestplace.service loads it afterwards.
blacklist amdgpu
# Every card goes to its HOST BAR0 address, same for every PLX switch. Guest has one emulated switch per
# host chain (100.conf): chain A p2prp/p2pup -> p2pdn1=03:00.0 (48), p2pdn2=04:00.0 (45); chain B
# p2prpb/p2pupb -> p2pdn3=07:00.0 (c8), p2pdn4=08:00.0 (c5). Must match r9700-barfix.sh CHAIN_*_AT.
#   chain A (40:01.1): 45 @0x260  48 @0x270      chain B (c0:01.1): c5 @0x140  c8 @0x150
#   chain C (00:03.1, 2026-10-06): p2prpc/p2pupc -> p2pdn5=0b:00.0 (host 05 @0x380), p2pdn6=0c:00.0 (host 08 @0x390)
options r9700_guestplace place=0000:03:00.0@0x27000000000,0000:04:00.0@0x26000000000,0000:07:00.0@0x15000000000,0000:08:00.0@0x14000000000,0000:0b:00.0@0x38000000000,0000:0c:00.0@0x39000000000
